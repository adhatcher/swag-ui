[project]
name = "swag-ui"
version = "0.1.0"
description = "Private SWAG configuration manager"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "docker>=7.1,<8",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "bandit>=1.8,<2",
  "pip-audit>=2.8,<3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.bandit]
exclude_dirs = ["backend/tests"]
